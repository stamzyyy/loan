spring.application.name=demo
# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
# Hibernate Dialect & Schema Auto-Generation
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Enable H2 Web Console (accessible via browser at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
#loan limits
loan.limits.min-amount=500.0
loan.limits.max-amount=50000.0
loan.limits.max-term-months=36
