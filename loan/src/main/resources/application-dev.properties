
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=MSSQLLocalDB;databaseName=loanmanagement;integratedSecurity=true;encrypt=true;trustServerCertificate=true
spring.datasource.username=
spring.datasource.password=

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#loan limits
loan.limits.min-amount=500.0
loan.limits.max-amount=50000.0
loan.limits.max-term-months=36
